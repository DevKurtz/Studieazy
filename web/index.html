<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Studieazy - Smart Study & Flashcard App">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Studieazy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Studieazy</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Capture the install event before Flutter starts so the app button can
    // still open the browser's native install confirmation when eligible.
    window.__studieazyInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.__studieazyInstallPrompt = event;
      window.dispatchEvent(new Event('studieazy-install-available'));
    });
    window.addEventListener('appinstalled', function () {
      window.__studieazyInstallPrompt = null;
    });
  </script>
</head>
<body>
  <!-- Firebase Configuration -->
  <script src="firebase-config.js"></script>
  <!-- Force CanvasKit renderer to prevent HTML renderer assertion bugs on mobile emulators -->
  <script>
    window.flutterWebRenderer = "canvaskit";
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
